name: Build desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev

      - name: Windows build dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc

      - name: Resolve modules
        run: go mod tidy

      - name: Unit tests
        run: go test ./internal/...

      - name: Build Windows GUI
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -ldflags='-H windowsgui' -o dist/AWG-Chain-Installer.exe ./cmd/awg-chain

      - name: Build Linux GUI
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -o dist/AWG-Chain-Installer-linux-amd64 ./cmd/awg-chain

      - name: Build macOS GUI
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -o dist/AWG-Chain-Installer-macos ./cmd/awg-chain

      - uses: actions/upload-artifact@v4
        with:
          name: awg-chain-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: awg-chain-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
